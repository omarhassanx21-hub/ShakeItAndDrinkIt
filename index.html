<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shake It And Drink It - Order Portal</title>
    
    <!-- Social Media / WhatsApp Meta Tags -->
    <meta property="og:title" content="Shake It And Drink It - Wholesale Portal">
    <meta property="og:description" content="Premium fresh juices for your coffee shop. Order directly via WhatsApp.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#010409">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="ar">العربية</button>
    </div>

    <header>
        <h1 data-i18n="title">Shake It And Drink It</h1>
        <p class="subtitle" data-i18n="subtitle">Fresh juices for your coffee shop</p>
    </header>

    <div id="menu">
        <div class="loader">Loading menu...</div>
    </div>

    <div class="total-summary">
        <span data-i18n="totalLabel">Total</span><span id="grand-total-display">0 L.P</span>
    </div>

    <div class="shop-info">
        <label for="shopName" data-i18n="shopLabel">Coffee Shop Name:</label>
        <input type="text" id="shopName" data-i18n-placeholder="shopPlaceholder" placeholder="Enter your shop name..." required>

        <label for="address" data-i18n="addressLabel">Delivery Address:</label>
        <input type="text" id="address" data-i18n-placeholder="addressPlaceholder" placeholder="Enter your address..." required>
    </div>

    <button id="whatsapp-btn" data-i18n="orderBtn">Send Order via WhatsApp</button>
</div>

<div id="toast-container"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
